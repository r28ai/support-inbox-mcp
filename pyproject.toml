[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "support-inbox-mcp"
version = "0.1.0"
description = "Support email becomes Linear bugs, refunds get handled, and fixed bugs get a reply in-thread."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "R28 AI, Inc.", email = "oss@r28.ai" }]
keywords = ["mcp", "mcp-server", "ai-agents", "charter", "gmail", "linear", "stripe", "granola", "google-docs", "slack", "google-calendar", "google-drive", "google-forms", "notion", "google-sheets"]
dependencies = ["charter-packs-mcp @ https://github.com/r28ai/charter-packs-mcp/releases/download/v0.1.0/charter_packs_mcp-0.1.0-py3-none-any.whl"]

[project.urls]
Repository = "https://github.com/r28ai/support-inbox-mcp"
Charter = "https://github.com/r28ai/charter"
Documentation = "https://docs.r28.ai/charter"

[project.scripts]
support-inbox-mcp = "support_inbox_mcp:main"

[tool.hatch.metadata]
# charter-packs-mcp is a dependency by its GitHub release's wheel, not a PyPI name.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/support_inbox_mcp"]
